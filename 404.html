<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeeDee Studio</title>
<link rel="canonical" href="https://deedeestudio.net/">
<noscript><meta http-equiv="refresh" content="0; url=https://deedeestudio.net/"></noscript>
<script>
const target = new URL('https://deedeestudio.net/');
const path = location.pathname.replace(/^\/+(?:(?:en|vi)(?:\/+|$))*/, '');
target.pathname += path;
target.search = location.search;
target.hash = location.hash;
location.replace(target.href);
</script>
</head>
<body>
<p><a href="https://deedeestudio.net/">Tiếp tục đến DeeDee Studio</a></p>
</body>
</html>
